<div class="dashboard-container">
  <aside [class.sidebar-closed]="!isSidebarOpen" class="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="/Farmacia-Logo.jpg" alt="Logo" class="logo-img">
        <span *ngIf="isSidebarOpen" class="logo-text">Centro Médico</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li *ngFor="let item of menuItems" class="nav-item">
          <button (click)="navigateTo(item.route)" [class.active]="currentRoute === item.route" class="nav-button">
            <span class="nav-label">{{ item.label }}</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>
  <div class="main-content">
    <header class="top-header">
      <div class="header-left">
        <button (click)="toggleSidebar()" class="toggle-btn">☰</button>
        <h1 class="page-title">{{ getPageTitle() }}</h1>
      </div>
      <div class="header-right">
        <button (click)="logout()" class="logout-btn">Salir</button>
      </div>
    </header>
    <main class="content-area">
      <div *ngIf="currentRoute === 'dashboard'" class="view-container">
        <h2 class="welcome-title">Dashboard En Desarrollo</h2>
      </div>
      <div *ngIf="currentRoute !== 'dashboard'" class="view-container">
        <div class="dev-message-container">
          <h2 class="dev-title">{{ getModuleName() }} En Desarrollo</h2>
          <p class="dev-subtitle">Esta sección está en construcción</p>
        </div>
      </div>
    </main>
  </div>
</div>
