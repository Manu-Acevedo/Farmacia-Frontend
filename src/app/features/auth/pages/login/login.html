<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 via-pink-50 to-purple-100 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">

  <div class="absolute top-0 left-0 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob"></div>
  <div class="absolute top-0 right-0 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob animation-delay-2000"></div>
  <div class="absolute -bottom-8 left-20 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob animation-delay-4000"></div>

  <div class="max-w-md w-full space-y-8 relative z-10">
    <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl p-10 border border-white/20">
      <div class="text-center">
        <div class="mx-auto h-32 w-32 bg-white rounded-full shadow-lg p-2 mb-6 transform hover:scale-105 transition-transform duration-300">
          <img class="h-full w-full object-cover rounded-full" src="/Farmacia-Logo.jpg" alt="Centro Médico Vidas Logo" />
        </div>
        <h2 class="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-3">
          Bienvenido
        </h2>
        <p class="text-gray-600 text-sm font-medium">Centro Médico Vidas</p>
        <p class="text-gray-500 text-xs mt-1">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Formulario -->
      <form class="mt-8 space-y-6" (submit)="onSubmit($event)">
        <div class="space-y-5">
          <!-- Campo de Email -->
          <div class="relative">
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
              Correo electrónico
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                </svg>
              </div>
              <input 
                id="email" 
                name="email" 
                type="email" 
                required 
                placeholder="tu@correo.com"
                class="block w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300 bg-gray-50 hover:bg-white"
              />
            </div>
          </div>

          <!-- Campo de Contraseña -->
          <div class="relative">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
              Contraseña
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input 
                id="password" 
                name="password" 
                type="password" 
                required 
                placeholder="••••••••"
                class="block w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300 bg-gray-50 hover:bg-white"
              />
            </div>
          </div>
        </div>

        <!-- Recordarme y Olvidaste contraseña -->
        <div class="flex items-center justify-between text-sm">
          <div class="flex items-center">
            <input 
              id="remember_me" 
              name="remember_me" 
              type="checkbox" 
              class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded cursor-pointer"
            />
            <label for="remember_me" class="ml-2 block text-gray-700 cursor-pointer hover:text-purple-600 transition-colors">
              Recuérdame
            </label>
          </div>

          <div>
            <a href="#" class="font-medium text-purple-600 hover:text-pink-600 transition-colors">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
        </div>

        <!-- Botón de inicio de sesión -->
        <div>
          <button 
            type="submit"
            class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-base font-semibold rounded-xl text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-all duration-300 transform hover:scale-[1.02] shadow-lg hover:shadow-xl"
          >
            <span class="absolute left-0 inset-y-0 flex items-center pl-4">
              <svg class="h-5 w-5 text-white group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
            </span>
            Iniciar sesión
          </button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-500 mt-4">
      © 2025 Centro Médico Vidas. Todos los derechos reservados.
    </p>
  </div>
</div>
